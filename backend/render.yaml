# Render Blueprint for the Sky Quest tool (API + built frontend on one URL).
# Create it in Render: New > Blueprint > this repo, Blueprint path: backend/render.yaml
# Reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sky-quest
    runtime: python
    plan: 0.5c-512mb          # Starter: 0.5 CPU, 512 MB, $7/month (Free has no disk and sleeps)
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: bash backend/scripts/render_build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BACKEND_DATA_DIR
        value: /opt/render/project/src/cache/_backend
      - key: PREBUILD_ON_START
        value: "1"
      - key: LIVE_QUERIES          # "1" = positions not in the cache are downloaded from the archive (slow, team decision 15 Nov); "0" = only cached targets
        value: "1"
    disk:
      name: cache
      mountPath: /opt/render/project/src/cache   # pipeline cache (cutouts) + backend frames
      sizeGB: 1
